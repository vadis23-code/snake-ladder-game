<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pickup Scorekeeper 🏀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    /* ── RESET & ROOT ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange:       #FF6B35;
      --orange-dark:  #E04F1A;
      --orange-glow:  rgba(255,107,53,0.35);
      --navy:         #0F0F23;
      --navy-mid:     #1A1A2E;
      --navy-light:   #16213E;
      --navy-card:    #0D1B2A;
      --gold:         #FFD700;
      --gold-dim:     #C9A227;
      --gold-glow:    rgba(255,215,0,0.3);
      --white:        #F0F0F0;
      --muted:        #7A7A9A;
      --danger:       #E53935;
      --success:      #43A047;
      --radius-sm:    10px;
      --radius-md:    16px;
      --radius-lg:    24px;
      --radius-xl:    32px;
      --shadow-btn:   0 5px 0 rgba(0,0,0,0.4);
      --transition:   0.14s ease;
    }

    html { height: 100%; }

    body {
      min-height: 100dvh;
      background: var(--navy);
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* ── SCREENS ──────────────────────────────────────────────────── */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
    }
    .screen.active { display: flex; }

    /* ── SETUP SCREEN ─────────────────────────────────────────────── */
    #screen-setup {
      background: radial-gradient(ellipse at top, #1e1e3c 0%, var(--navy) 70%);
      padding: 24px 20px 40px;
      gap: 0;
    }

    .app-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 28px;
    }
    .app-logo { font-size: 52px; line-height: 1; }
    .app-title {
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: clamp(32px, 8vw, 48px);
      letter-spacing: 0.06em;
      color: var(--orange);
      margin-top: 8px;
    }
    .app-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.04em;
    }

    .setup-form {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .setup-section {
      background: var(--navy-mid);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-md);
      padding: 18px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      display: block;
    }

    /* Chip groups */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      padding: 10px 18px;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 50px;
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .chip:hover { border-color: var(--orange); color: var(--white); }
    .chip.selected {
      border-color: var(--orange);
      background: var(--orange);
      color: var(--navy);
    }

    /* Team name inputs */
    .team-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .team-name-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-sm);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 14px;
      text-align: center;
      outline: none;
      transition: border-color var(--transition);
    }
    .team-name-input:focus { border-color: var(--orange); }
    .team-name-input::placeholder { color: var(--muted); font-weight: 400; }
    .vs-divider {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* Custom number input */
    .custom-number-input {
      margin-top: 12px;
      width: 120px;
      background: rgba(255,255,255,0.06);
      border: 2px solid var(--orange);
      border-radius: var(--radius-sm);
      color: var(--white);
      font-size: 18px;
      font-weight: 700;
      padding: 10px 14px;
      text-align: center;
      outline: none;
    }

    /* Start button */
    .btn-primary {
      background: var(--orange);
      color: var(--navy);
      border: none;
      border-radius: var(--radius-md);
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: 22px;
      letter-spacing: 0.08em;
      padding: 18px 32px;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: transform var(--transition), box-shadow var(--transition);
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
    .btn-primary:hover { background: var(--orange-dark); }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-md);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 24px;
      cursor: pointer;
      width: 100%;
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-secondary:hover { border-color: var(--orange); color: var(--white); }

    .setup-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 480px;
    }

    /* ── GAME SCREEN ──────────────────────────────────────────────── */
    #screen-game {
      background: var(--navy);
      padding: 0;
      justify-content: flex-start;
    }

    /* Game Point Banner */
    .game-point-banner {
      width: 100%;
      background: linear-gradient(90deg, var(--orange), var(--orange-dark));
      color: var(--navy);
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: clamp(18px, 4vw, 26px);
      letter-spacing: 0.14em;
      text-align: center;
      padding: 10px;
      animation: pulseBar 0.9s ease-in-out infinite alternate;
    }
    @keyframes pulseBar {
      from { opacity: 0.8; }
      to   { opacity: 1; }
    }

    /* Scoreboard */
    #scoreboard {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      width: 100%;
      min-height: 52vh;
      align-items: stretch;
    }

    .team-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px 16px;
      gap: 8px;
      transition: box-shadow var(--transition);
      position: relative;
    }
    .team-panel.leading {
      box-shadow: inset 0 -4px 0 var(--gold);
    }
    .team-panel.leading .team-score {
      color: var(--gold);
      text-shadow: 0 0 30px var(--gold-glow);
    }

    .team-name {
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: clamp(18px, 4.5vw, 28px);
      letter-spacing: 0.06em;
      text-align: center;
      color: var(--white);
      min-height: 36px;
      line-height: 1.1;
      word-break: break-word;
    }

    .team-score {
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: clamp(80px, 20vw, 130px);
      line-height: 1;
      color: var(--white);
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .score-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .btn-score {
      background: var(--navy-light);
      color: var(--white);
      border: 2px solid rgba(255,107,53,0.4);
      border-radius: var(--radius-sm);
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: 22px;
      letter-spacing: 0.06em;
      padding: 14px 8px;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
      -webkit-tap-highlight-color: transparent;
      min-height: 56px;
    }
    .btn-score:hover { background: var(--navy-card); border-color: var(--orange); }
    .btn-score:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
    .btn-score.pts-flash {
      background: var(--orange);
      color: var(--navy);
    }

    /* Center column */
    #center-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-left: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
    }

    .target-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-align: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .lead-arrow {
      font-size: 24px;
      transition: transform 0.3s ease;
    }

    /* Status bar */
    #status-bar {
      width: 100%;
      background: var(--navy-mid);
      border-top: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 10px 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      min-height: 40px;
    }
    #status-bar.leading-msg { color: var(--gold); }
    #status-bar.tied-msg    { color: var(--muted); }

    /* Action row */
    #action-row {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      background: var(--navy-mid);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 14px 8px;
      cursor: pointer;
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
      min-height: 52px;
    }
    .btn-action:hover  { border-color: rgba(255,255,255,0.3); }
    .btn-action:active { transform: translateY(2px); }

    .btn-voice-off { color: var(--muted); }
    .btn-voice-on  {
      background: var(--orange);
      color: var(--navy);
      border-color: var(--orange);
      animation: micPulse 1.2s ease-in-out infinite;
    }
    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--orange-glow); }
      50%       { box-shadow: 0 0 0 10px transparent; }
    }

    .btn-danger { color: var(--danger); border-color: rgba(229,57,53,0.3); }
    .btn-danger:hover { background: rgba(229,57,53,0.1); }

    /* Voice feedback */
    #voice-feedback {
      margin: 0 16px;
      background: rgba(255,107,53,0.08);
      border: 1px solid rgba(255,107,53,0.3);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      width: calc(100% - 32px);
    }
    #voice-heard  { color: var(--muted); margin-bottom: 4px; }
    #voice-action { color: var(--orange); font-weight: 700; }

    /* History */
    #history-panel {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 16px 16px;
      min-height: 0;
    }
    .history-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 0 8px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .history-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      max-height: 160px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      font-size: 14px;
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .h-team { flex: 1; font-weight: 600; }
    .h-pts  { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--orange); }
    .h-dot  { font-size: 10px; color: var(--muted); }
    .history-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 12px 0; }

    /* ── WINNER SCREEN ────────────────────────────────────────────── */
    #screen-winner {
      background: radial-gradient(ellipse at center, #1e1e3c 0%, var(--navy) 70%);
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      top: -20px;
      border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg);   opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    #winner-card {
      background: var(--navy-mid);
      border: 3px solid var(--gold);
      border-radius: var(--radius-xl);
      padding: 48px 32px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 80px var(--gold-glow);
      max-width: 400px;
      width: 100%;
      z-index: 1;
      position: relative;
      animation: bounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes bounceIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    .winner-trophy { font-size: 72px; line-height: 1; margin-bottom: 12px; }
    .winner-name {
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: clamp(36px, 10vw, 60px);
      color: var(--gold);
      letter-spacing: 0.04em;
      line-height: 1.1;
    }
    .winner-subtitle {
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: 20px;
      color: var(--orange);
      letter-spacing: 0.2em;
      margin-bottom: 16px;
    }
    .winner-score {
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: clamp(28px, 7vw, 44px);
      color: var(--white);
      margin-bottom: 8px;
    }
    .winner-meta {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-bottom: 32px;
    }
    .winner-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── RESPONSIVE ───────────────────────────────────────────────── */
    @media (max-width: 380px) {
      .team-score { font-size: 70px; }
      .btn-score { min-height: 48px; font-size: 19px; padding: 10px 6px; }
      #scoreboard { grid-template-columns: 1fr 44px 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════
     SCREEN 1: SETUP
════════════════════════════════════════════════════════ -->
<div id="screen-setup" class="screen active">
  <div class="app-header">
    <div class="app-logo">🏀</div>
    <h1 class="app-title">Pickup Scorekeeper</h1>
    <p class="app-subtitle">Track your pickup game · No login needed</p>
  </div>

  <div class="setup-form">

    <!-- Game Type -->
    <section class="setup-section">
      <label class="section-label">Game Type</label>
      <div class="chip-group" id="chips-game-type">
        <button class="chip selected" data-value="3v3" onclick="selectChip('chips-game-type', '3v3', this)">3-on-3</button>
        <button class="chip" data-value="4v4" onclick="selectChip('chips-game-type', '4v4', this)">4-on-4</button>
        <button class="chip" data-value="5v5" onclick="selectChip('chips-game-type', '5v5', this)">5-on-5</button>
        <button class="chip" data-value="custom" onclick="selectChip('chips-game-type', 'custom', this)">Custom</button>
      </div>
    </section>

    <!-- Team Names -->
    <section class="setup-section">
      <label class="section-label">Team Names</label>
      <div class="team-name-row">
        <input id="input-team-a" class="team-name-input" type="text" maxlength="16" placeholder="Team A" autocomplete="off">
        <span class="vs-divider">VS</span>
        <input id="input-team-b" class="team-name-input" type="text" maxlength="16" placeholder="Team B" autocomplete="off">
      </div>
    </section>

    <!-- Win Score -->
    <section class="setup-section">
      <label class="section-label">Win Score</label>
      <div class="chip-group" id="chips-win-score">
        <button class="chip" data-value="11" onclick="selectChip('chips-win-score', '11', this)">11</button>
        <button class="chip" data-value="15" onclick="selectChip('chips-win-score', '15', this)">15</button>
        <button class="chip selected" data-value="21" onclick="selectChip('chips-win-score', '21', this)">21</button>
        <button class="chip" data-value="custom" onclick="selectChip('chips-win-score', 'custom', this); toggleWinCustom()">Custom</button>
      </div>
      <input id="input-win-custom" class="custom-number-input hidden" type="number" min="2" max="999" placeholder="e.g. 30">
    </section>

    <!-- Scoring Rule -->
    <section class="setup-section">
      <label class="section-label">Scoring Rule</label>
      <div class="chip-group" id="chips-scoring">
        <button class="chip selected" data-value="1s2s" onclick="selectChip('chips-scoring', '1s2s', this); updateScoringRule()">1s &amp; 2s</button>
        <button class="chip" data-value="2s3s" onclick="selectChip('chips-scoring', '2s3s', this); updateScoringRule()">2s &amp; 3s</button>
        <button class="chip" data-value="custom" onclick="selectChip('chips-scoring', 'custom', this); updateScoringRule()">Custom</button>
      </div>
      <div id="custom-scoring-form" class="hidden" style="margin-top:14px; display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; align-items:center; gap:12px;">
          <label style="font-size:14px; color:var(--muted); flex:1;">Small basket</label>
          <input id="input-pts-small" type="number" min="1" max="9" value="1" class="custom-number-input" style="width:80px; margin:0;">
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <label style="font-size:14px; color:var(--muted); flex:1;">Large basket</label>
          <input id="input-pts-large" type="number" min="1" max="9" value="2" class="custom-number-input" style="width:80px; margin:0;">
        </div>
      </div>
    </section>

  </div><!-- /.setup-form -->

  <div class="setup-actions" style="margin-top:24px;">
    <button id="btn-start-game" class="btn-primary" onclick="handleStartGame()">Start Game</button>
    <button id="btn-resume" class="btn-secondary hidden" onclick="handleResume()">Resume Last Game</button>
  </div>
</div><!-- /#screen-setup -->


<!-- ════════════════════════════════════════════════════
     SCREEN 2: GAME
════════════════════════════════════════════════════════ -->
<div id="screen-game" class="screen">

  <!-- Game Point Banner -->
  <div id="banner-game-point" class="game-point-banner hidden"></div>

  <!-- Scoreboard -->
  <div id="scoreboard">

    <!-- Team A -->
    <div id="team-a-panel" class="team-panel">
      <div id="team-a-name" class="team-name">Team A</div>
      <div id="team-a-score" class="team-score">0</div>
      <div class="score-buttons" id="score-btns-a">
        <!-- rendered by renderScoreButtons() -->
      </div>
    </div>

    <!-- Center -->
    <div id="center-column">
      <div class="target-score" id="target-display">FIRST TO 21</div>
      <div class="lead-arrow" id="lead-arrow">—</div>
    </div>

    <!-- Team B -->
    <div id="team-b-panel" class="team-panel">
      <div id="team-b-name" class="team-name">Team B</div>
      <div id="team-b-score" class="team-score">0</div>
      <div class="score-buttons" id="score-btns-b">
        <!-- rendered by renderScoreButtons() -->
      </div>
    </div>

  </div><!-- /#scoreboard -->

  <!-- Status Bar -->
  <div id="status-bar">—</div>

  <!-- Action Row -->
  <div id="action-row">
    <button id="btn-undo" class="btn-action" onclick="undoLastScore()" title="Undo last score">↩ Undo</button>
    <button id="btn-voice" class="btn-action btn-voice-off" onclick="toggleVoice()">🎤 Mic</button>
    <button class="btn-action btn-danger" onclick="handleEndGame()">End Game</button>
  </div>

  <!-- Voice Feedback -->
  <div id="voice-feedback" class="hidden">
    <div id="voice-heard"></div>
    <div id="voice-action"></div>
  </div>

  <!-- History -->
  <div id="history-panel">
    <div class="history-header">Score History</div>
    <ul id="history-list" class="history-list">
      <li class="history-empty">No scores yet</li>
    </ul>
  </div>

</div><!-- /#screen-game -->


<!-- ════════════════════════════════════════════════════
     SCREEN 3: WINNER
════════════════════════════════════════════════════════ -->
<div id="screen-winner" class="screen">
  <div class="confetti-container" id="winner-confetti"></div>
  <div id="winner-card">
    <div class="winner-trophy">🏆</div>
    <div class="winner-name" id="winner-team-name"></div>
    <div class="winner-subtitle">WINS!</div>
    <div class="winner-score" id="winner-final-score"></div>
    <div class="winner-meta" id="winner-meta"></div>
    <div class="winner-actions">
      <button class="btn-primary" onclick="handlePlayAgain()">Play Again</button>
      <button class="btn-secondary" onclick="handleNewSetup()">Change Settings</button>
    </div>
  </div>
</div><!-- /#screen-winner -->


<script>
/* ════════════════════════════════════════════════════════
   PICKUP SCOREKEEPER — core logic
   ──────────────────────────────────────────────────────
   Screens: setup → game → winner
   State is persisted to localStorage on every change.
════════════════════════════════════════════════════════ */

const STORAGE_KEY = 'pickup_scorekeeper_v1';

/* ── STATE ─────────────────────────────────────────── */
let state = {
  gameType:    '3v3',
  teamA:       { name: 'Team A', score: 0 },
  teamB:       { name: 'Team B', score: 0 },
  winScore:    21,
  ptsSmall:    1,
  ptsLarge:    2,
  history:     [],
  voiceActive: false,
  gameOver:    false,
};

/* ── PERSISTENCE ────────────────────────────────────── */
function saveState() {
  try {
    const toSave = Object.assign({}, state, { voiceActive: false });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (_) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

function clearState() {
  localStorage.removeItem(STORAGE_KEY);
}

/* ── SCREEN NAVIGATION ──────────────────────────────── */
function showScreen(name) {
  ['setup', 'game', 'winner'].forEach(s => {
    const el = document.getElementById(`screen-${s}`);
    if (s === name) {
      el.classList.add('active');
      el.classList.remove('hidden');
    } else {
      el.classList.remove('active');
      el.classList.add('hidden');
    }
  });
}

/* ── SETUP SCREEN LOGIC ─────────────────────────────── */
// chip-group state tracked in data-selected attribute
let chipSelections = {
  'chips-game-type':  '3v3',
  'chips-win-score':  '21',
  'chips-scoring':    '1s2s',
};

function selectChip(groupId, value, el) {
  chipSelections[groupId] = value;
  document.querySelectorAll(`#${groupId} .chip`).forEach(c => {
    c.classList.toggle('selected', c.dataset.value === value);
  });
}

function toggleWinCustom() {
  const inp = document.getElementById('input-win-custom');
  const isCustom = chipSelections['chips-win-score'] === 'custom';
  inp.classList.toggle('hidden', !isCustom);
  if (isCustom) inp.focus();
}

function updateScoringRule() {
  const rule = chipSelections['chips-scoring'];
  document.getElementById('custom-scoring-form').classList.toggle('hidden', rule !== 'custom');
  // update display immediately if we're already in-game (for resume scenario)
  if (!document.getElementById('screen-game').classList.contains('hidden')) {
    renderScoreButtons();
  }
}

function handleStartGame() {
  const nameA = document.getElementById('input-team-a').value.trim() || 'Team A';
  const nameB = document.getElementById('input-team-b').value.trim() || 'Team B';

  let winScore = parseInt(chipSelections['chips-win-score'], 10);
  if (chipSelections['chips-win-score'] === 'custom') {
    winScore = parseInt(document.getElementById('input-win-custom').value, 10) || 21;
  }

  let ptsSmall = 1, ptsLarge = 2;
  if (chipSelections['chips-scoring'] === '2s3s') { ptsSmall = 2; ptsLarge = 3; }
  else if (chipSelections['chips-scoring'] === 'custom') {
    ptsSmall = parseInt(document.getElementById('input-pts-small').value, 10) || 1;
    ptsLarge = parseInt(document.getElementById('input-pts-large').value, 10) || 2;
  }

  state = {
    gameType:    chipSelections['chips-game-type'],
    teamA:       { name: nameA,  score: 0 },
    teamB:       { name: nameB,  score: 0 },
    winScore,
    ptsSmall,
    ptsLarge,
    history:     [],
    voiceActive: false,
    gameOver:    false,
  };

  saveState();
  renderGame();
  showScreen('game');
}

function handleResume() {
  const saved = loadState();
  if (!saved) return;
  state = saved;
  state.voiceActive = false;
  renderGame();
  showScreen('game');
}

/* ── GAME SCREEN RENDER ─────────────────────────────── */
function renderGame() {
  // Names
  document.getElementById('team-a-name').textContent = state.teamA.name;
  document.getElementById('team-b-name').textContent = state.teamB.name;

  // Scores
  document.getElementById('team-a-score').textContent = state.teamA.score;
  document.getElementById('team-b-score').textContent = state.teamB.score;

  // Target
  document.getElementById('target-display').textContent = `FIRST TO ${state.winScore}`;

  // Score buttons
  renderScoreButtons();

  // Leading highlight & status
  updateLeadingUI();

  // Game point banner
  updateGamePointBanner();

  // History
  renderHistory();
}

function renderScoreButtons() {
  const pts = validPoints();
  ['a', 'b'].forEach(team => {
    const container = document.getElementById(`score-btns-${team}`);
    container.innerHTML = pts.map(p =>
      `<button class="btn-score" data-team="${team}" data-pts="${p}">+${p}</button>`
    ).join('');
  });
  // Re-attach delegated listener
  rewireScoreButtons();
}

function validPoints() {
  const { ptsSmall, ptsLarge } = state;
  // Always show both scoring options; if equal, show just one
  if (ptsSmall === ptsLarge) return [ptsSmall];
  return [ptsSmall, ptsLarge];
}

let scoreBoardListening = false;
function rewireScoreButtons() {
  const board = document.getElementById('scoreboard');
  if (scoreBoardListening) return; // delegated — only attach once
  scoreBoardListening = true;
  board.addEventListener('click', e => {
    const btn = e.target.closest('.btn-score');
    if (!btn) return;
    addScore(btn.dataset.team, parseInt(btn.dataset.pts, 10));
    flashButton(btn);
  });
}

function flashButton(btn) {
  btn.classList.add('pts-flash');
  setTimeout(() => btn.classList.remove('pts-flash'), 200);
}

function updateLeadingUI() {
  const aPanel = document.getElementById('team-a-panel');
  const bPanel = document.getElementById('team-b-panel');
  const arrow  = document.getElementById('lead-arrow');
  const bar    = document.getElementById('status-bar');
  const a = state.teamA.score;
  const b = state.teamB.score;

  aPanel.classList.toggle('leading', a > b);
  bPanel.classList.toggle('leading', b > a);

  if (a === b) {
    arrow.textContent = '—';
    bar.textContent = 'Game is tied';
    bar.className = 'tied-msg';
  } else if (a > b) {
    arrow.textContent = '◀';
    bar.textContent = `${state.teamA.name} leads by ${a - b}`;
    bar.className = 'leading-msg';
  } else {
    arrow.textContent = '▶';
    bar.textContent = `${state.teamB.name} leads by ${b - a}`;
    bar.className = 'leading-msg';
  }
}

function updateGamePointBanner() {
  const banner = document.getElementById('banner-game-point');
  const a = state.teamA.score;
  const b = state.teamB.score;
  const w = state.winScore;
  const ps = state.ptsSmall;

  let gpTeam = null;
  if (a + ps >= w && b + ps < w) gpTeam = state.teamA.name;
  else if (b + ps >= w && a + ps < w) gpTeam = state.teamB.name;
  else if (a + ps >= w && b + ps >= w) gpTeam = 'Both Teams';

  if (gpTeam && !state.gameOver) {
    banner.classList.remove('hidden');
    banner.textContent = gpTeam === 'Both Teams'
      ? '🔥 GAME POINT — BOTH TEAMS!'
      : `🔥 GAME POINT — ${gpTeam.toUpperCase()}!`;
  } else {
    banner.classList.add('hidden');
  }
}

/* ── SCORING ────────────────────────────────────────── */
function addScore(team, pts) {
  if (state.gameOver) return;
  state[`team${team.toUpperCase()}`].score += pts;
  state.history.unshift({ team, pts, timestamp: Date.now() });
  saveState();
  renderGame();
  checkWinCondition();
}

function undoLastScore() {
  if (state.history.length === 0) return;
  const last = state.history.shift();
  state[`team${last.team.toUpperCase()}`].score -= last.pts;
  if (state[`team${last.team.toUpperCase()}`].score < 0)
    state[`team${last.team.toUpperCase()}`].score = 0;
  saveState();
  renderGame();
  showVoiceFeedback('', 'Last score removed.');
}

function checkWinCondition() {
  const aWon = state.teamA.score >= state.winScore;
  const bWon = state.teamB.score >= state.winScore;
  if (!aWon && !bWon) return;

  state.gameOver = true;
  stopVoice();
  saveState();

  const winner = aWon ? state.teamA : state.teamB;
  const loser  = aWon ? state.teamB : state.teamA;

  document.getElementById('winner-team-name').textContent  = winner.name;
  document.getElementById('winner-final-score').textContent = `${winner.score} – ${loser.score}`;
  document.getElementById('winner-meta').textContent =
    `${state.gameType} · First to ${state.winScore}`;

  launchConfetti();
  showScreen('winner');
}

/* ── HISTORY ────────────────────────────────────────── */
function renderHistory() {
  const list = document.getElementById('history-list');
  if (state.history.length === 0) {
    list.innerHTML = '<li class="history-empty">No scores yet</li>';
    return;
  }
  list.innerHTML = state.history.slice(0, 40).map((entry, i) => {
    const name = entry.team === 'a' ? state.teamA.name : state.teamB.name;
    const dot  = i === 0 ? '<span class="h-dot">●</span>' : '';
    return `<li class="history-item">
      ${dot}
      <span class="h-team">${escHtml(name)}</span>
      <span class="h-pts">+${entry.pts}</span>
    </li>`;
  }).join('');
}

function escHtml(str) {
  return str.replace(/[&<>"']/g, m =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/* ── END GAME / RESET ───────────────────────────────── */
function handleEndGame() {
  if (!confirm('End game and declare a winner based on current score?')) return;
  const aScore = state.teamA.score;
  const bScore = state.teamB.score;

  state.gameOver = true;
  stopVoice();
  saveState();

  const winner = aScore >= bScore ? state.teamA : state.teamB;
  const loser  = aScore >= bScore ? state.teamB : state.teamA;
  document.getElementById('winner-team-name').textContent  = winner.name;
  document.getElementById('winner-final-score').textContent = `${winner.score} – ${loser.score}`;
  document.getElementById('winner-meta').textContent =
    `${state.gameType} · First to ${state.winScore}`;

  launchConfetti();
  showScreen('winner');
}

function handlePlayAgain() {
  state.teamA.score = 0;
  state.teamB.score = 0;
  state.history = [];
  state.gameOver = false;
  state.voiceActive = false;
  saveState();
  renderGame();
  showScreen('game');
}

function handleNewSetup() {
  clearState();
  stopVoice();
  showScreen('setup');
  document.getElementById('btn-resume').classList.add('hidden');
}

/* ── CONFETTI ───────────────────────────────────────── */
function launchConfetti() {
  const container = document.getElementById('winner-confetti');
  container.innerHTML = '';
  const colors = ['#FF6B35', '#FFD700', '#F0F0F0', '#0F3460', '#E04F1A', '#C9A227', '#FFFFFF'];
  for (let i = 0; i < 90; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const size = 8 + Math.random() * 10;
    p.style.cssText = `
      left: ${Math.random() * 100}vw;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      width: ${size}px;
      height: ${size * (0.4 + Math.random() * 0.6)}px;
      animation-duration: ${2 + Math.random() * 2}s;
      animation-delay: ${Math.random() * 1.8}s;
    `;
    container.appendChild(p);
  }
  setTimeout(() => { container.innerHTML = ''; }, 6000);
}

/* ── VOICE RECOGNITION ──────────────────────────────── */
let recognition = null;

function initVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    const btn = document.getElementById('btn-voice');
    btn.textContent = '🎤 Not Supported';
    btn.disabled = true;
    showVoiceFeedback('', 'Voice scoring is not supported on this browser. Please use Chrome or Edge.');
    return false;
  }

  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
  recognition.maxAlternatives = 3;

  recognition.onresult = event => {
    let handled = false;
    for (let i = 0; i < event.results[0].length && !handled; i++) {
      const transcript = event.results[0][i].transcript.toLowerCase().trim();
      showVoiceFeedback(`Heard: "${transcript}"`, '');
      handled = parseVoiceCommand(transcript);
    }
    if (!handled) {
      showVoiceFeedback(
        document.getElementById('voice-heard').textContent,
        'Sorry, I didn\'t understand. Try: "Team A scores two"'
      );
    }
  };

  recognition.onend = () => {
    if (state.voiceActive && !state.gameOver) {
      setTimeout(() => {
        try { recognition.start(); } catch (_) {}
      }, 300);
    }
  };

  recognition.onerror = event => {
    if (event.error === 'no-speech') return;
    if (event.error === 'not-allowed') {
      showVoiceFeedback('', 'Microphone permission denied. Please allow mic access.');
      state.voiceActive = false;
      updateVoiceButton();
    }
  };

  return true;
}

function toggleVoice() {
  if (!recognition) {
    if (!initVoice()) return;
  }
  state.voiceActive = !state.voiceActive;
  if (state.voiceActive) {
    try {
      recognition.start();
      showVoiceFeedback('', 'Listening… say a command');
    } catch (_) {}
  } else {
    stopVoice();
    document.getElementById('voice-feedback').classList.add('hidden');
  }
  updateVoiceButton();
}

function stopVoice() {
  state.voiceActive = false;
  try { if (recognition) recognition.stop(); } catch (_) {}
  updateVoiceButton();
}

function updateVoiceButton() {
  const btn = document.getElementById('btn-voice');
  if (state.voiceActive) {
    btn.textContent = '🔴 Mic ON';
    btn.classList.remove('btn-voice-off');
    btn.classList.add('btn-voice-on');
  } else {
    btn.textContent = '🎤 Mic';
    btn.classList.remove('btn-voice-on');
    btn.classList.add('btn-voice-off');
  }
}

function showVoiceFeedback(heard, action) {
  const fb = document.getElementById('voice-feedback');
  fb.classList.remove('hidden');
  if (heard  !== '') document.getElementById('voice-heard').textContent  = heard;
  if (action !== '') document.getElementById('voice-action').textContent = action;
}

/* ── VOICE COMMAND PARSING ──────────────────────────── */
function resolveTeam(t) {
  const aName = state.teamA.name.toLowerCase();
  const bName = state.teamB.name.toLowerCase();

  if (t.includes(aName)) return 'a';
  if (t.includes(bName)) return 'b';

  if (/\b(team\s*a|team\s*1|first\s*team|red\s*team|light\s*team)\b/.test(t)) return 'a';
  if (/\b(team\s*b|team\s*2|second\s*team|blue\s*team|dark\s*team)\b/.test(t)) return 'b';

  return null;
}

function extractPoints(t) {
  const map = { 'one': 1, 'two': 2, 'three': 3, '1': 1, '2': 2, '3': 3 };
  const match = t.match(/\b(one|two|three|1|2|3)\b/i);
  return match ? (map[match[1].toLowerCase()] || null) : null;
}

function speakScore() {
  const msg = `${state.teamA.name} ${state.teamA.score}, ${state.teamB.name} ${state.teamB.score}`;
  showVoiceFeedback('', msg);
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(msg);
    utt.rate = 0.95;
    window.speechSynthesis.speak(utt);
  }
}

function parseVoiceCommand(transcript) {
  const t = transcript.toLowerCase().trim();

  // Undo
  if (/\b(undo|cancel|take\s*it\s*back|remove\s*last|mistake)\b/.test(t)) {
    undoLastScore();
    showVoiceFeedback(`Heard: "${transcript}"`, 'Undone last score.');
    return true;
  }

  // Score check
  if (/\b(score\s*check|what'?s?\s*the\s*score|score|current\s*score)\b/.test(t)) {
    speakScore();
    return true;
  }

  // Game over / End game
  if (/\b(game\s*over|end\s*game|that'?s?\s*game|we'?re?\s*done|finish)\b/.test(t)) {
    handleEndGame();
    return true;
  }

  // Reset
  if (/\b(reset\s*game|reset|start\s*over|new\s*game)\b/.test(t)) {
    if (confirm('Reset game?')) {
      handlePlayAgain();
      showVoiceFeedback(`Heard: "${transcript}"`, 'Game reset!');
    }
    return true;
  }

  // Score command: resolve team + points
  const team = resolveTeam(t);
  if (!team) return false;

  const pts = extractPoints(t);
  if (!pts) return false;

  addScore(team, pts);
  const teamName = team === 'a' ? state.teamA.name : state.teamB.name;
  showVoiceFeedback(
    `Heard: "${transcript}"`,
    `Added ${pts} point${pts > 1 ? 's' : ''} to ${teamName}`
  );
  return true;
}

/* ── INIT ───────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  const saved = loadState();
  const canResume = saved && !saved.gameOver && saved.history && saved.history.length > 0;

  if (canResume) {
    document.getElementById('btn-resume').classList.remove('hidden');
  }

  // Pre-fill team names from last game
  if (saved) {
    if (saved.teamA && saved.teamA.name !== 'Team A')
      document.getElementById('input-team-a').value = saved.teamA.name;
    if (saved.teamB && saved.teamB.name !== 'Team B')
      document.getElementById('input-team-b').value = saved.teamB.name;
  }
});
</script>
</body>
</html>
